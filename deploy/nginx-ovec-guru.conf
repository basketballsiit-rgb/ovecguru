# ==============================================================================
# OVEC GURU - Nginx Reverse Proxy & Static Frontend Config (CentOS Stream 9)
# Install:
#   sudo cp /home/ovec_guru/deploy/nginx-ovec-guru.conf /etc/nginx/conf.d/ovec-guru.conf
#   sudo nginx -t && sudo systemctl enable --now nginx
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Keep all Nginx logs and temporary upload buffers strictly under /home/ovec_guru
    access_log /home/ovec_guru/logs/nginx_access.log;
    error_log  /home/ovec_guru/logs/nginx_error.log warn;

    client_max_body_size 50M;
    client_body_temp_path /home/ovec_guru/tmp/nginx_body 1 2;

    # Lightweight React Static Build (zero Node.js runtime RAM overhead)
    root /home/ovec_guru/frontend/dist;
    index index.html;

    # FastAPI Backend API + Smooth SSE Streaming (/api/chat/stream)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Critical for Server-Sent Events (SSE) chatbot streaming without stalling
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_temp_path /home/ovec_guru/tmp/nginx_proxy 1 2;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache static hashed assets aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
