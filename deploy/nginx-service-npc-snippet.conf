    # =========================================================================
    # 🎓 [NEW] OVEC GURU — ระบบแชตบอทอัจฉริยะ สอศ. (FastAPI Port 8000 + Static UI)
    # วางบล็อกนี้ไว้ใน server { listen 443 ssl; server_name service.npc.ac.th; ... }
    # =========================================================================
    location = /ovec_guru {
        return 301 $scheme://$http_host/ovec_guru/;
    }

    location /ovec_guru/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # สำคัญมากสำหรับแชตบอท Streaming (SSE) ให้ไหลลื่นไม่ค้าง
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        client_max_body_size 50M;
        proxy_temp_path /home/ovec_guru/tmp/nginx_proxy 1 2;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ovec_guru/ {
        alias /home/ovec_guru/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /ovec_guru/index.html;
    }
